# Local dev stack: `docker compose up --build` (or run start.bat).
#   frontend -> http://localhost:5173  (Vite dev server, hot reload from ./frontend)
#   backend  -> http://localhost:8000  (FastAPI; docs at /docs)
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Vite proxies /api/* here; inside compose the backend is reachable by service name.
      VITE_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep Linux node_modules in a volume so they don't clash with Windows ones.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  chroma_data:
  frontend_node_modules:
