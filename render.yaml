# Render Blueprint — deploys the FastAPI backend (the frontend lives on Vercel).
# Free plan: 512 MB RAM, no persistent disk (Chroma data resets on each deploy/restart).
services:
  - type: web
    name: earningslens-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: SEC_EDGAR_USER_AGENT
        sync: false
      # Deployed frontend origin, e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
